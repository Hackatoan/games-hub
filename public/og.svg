  <rect width="1200" height="630" fill="url(#glow2)"/>
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="112" font-weight="900" fill="url(#title)" text-anchor="middle" letter-spacing="-2">Hackatoa Games</text>
  <text x="600" y="365" font-family="Arial, sans-serif" font-size="34" fill="#d2bab0" text-anchor="middle">Free browser games &#8212; no sign-up required</text>
