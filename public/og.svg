      <stop offset="100%" style="stop-color:#f9a8d4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="35%" r="55%">
      <stop offset="0%" style="stop-color:#831843;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#831843;stop-opacity:0"/>
